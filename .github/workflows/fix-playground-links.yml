name: Fix remaining Playground links

on:
  push:
    paths:
      - '.github/workflows/fix-playground-links.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining Corner navigation labels
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '← back to Salene’s Corner': '← Back to Salene’s Playground',
              '← Back to Salene’s Corner': '← Back to Salene’s Playground',
              "← back to Salene's Corner": "← Back to Salene’s Playground",
              "← Back to Salene's Corner": "← Back to Salene’s Playground",
              '✦ Salene’s corner': '← Back to Salene’s Playground',
              '✦ Salene’s Corner': '← Back to Salene’s Playground',
              "✦ Salene's corner": '← Back to Salene’s Playground',
              "✦ Salene's Corner": '← Back to Salene’s Playground',
          }

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == Path('.github/workflows/fix-playground-links.yml'):
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.css', '.md'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Changed:', changed)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-playground-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining labels needed changes."
            exit 0
          fi
          git commit -m "Rename remaining return links to Salene's Playground"
          git push
