<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Should I Text My Ex?</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:Georgia,"Times New Roman",serif;
  background:linear-gradient(145deg,#ffffff 0%,#f5f6fb 55%,#eef0fa 100%);
  color:#171a21;overflow-x:hidden;
}
.card{width:100%;text-align:center;padding:38px 0}
.eyebrow{margin:0 0 12px;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#85899a}
.title-wrap{width:100%;overflow:hidden;margin:0 0 14px}
h1{
  margin:0;display:inline-block;white-space:nowrap;
  font-size:clamp(48px,8vw,96px);line-height:1;letter-spacing:-.045em;
  animation:title-scroll 14s linear infinite;
}
@keyframes title-scroll{
  0%{transform:translateX(100vw)}
  100%{transform:translateX(-100%)}
}
.subtext{margin:16px 0 30px;font-size:20px;font-style:italic;color:#74788d}
.coin-wrap{height:245px;display:grid;place-items:center;margin:0 auto 10px;perspective:1000px}
.coin{
  cursor:pointer;
  position:relative;width:190px;height:190px;border-radius:50%;
  display:grid;place-items:center;
  background:
    radial-gradient(circle at 32% 25%,#ffffff 0%,#f2f3f5 18%,#cfd2d6 48%,#f8f9fa 70%,#aeb2b7 100%);
  border:7px solid #c1c4c8;
  box-shadow:
    inset 0 0 0 3px #fafafa,
    inset 0 0 0 8px #aeb2b7,
    inset 0 0 18px rgba(60,65,72,.28),
    0 18px 30px rgba(40,45,55,.22);
  color:#70757c;
  font-family:Georgia,"Times New Roman",serif;
  font-size:92px;font-weight:400;
  text-shadow:1px 1px 1px #fff,-1px -1px 1px #8e9297;
  transform-style:preserve-3d;
}
.coin::before{
  content:"";
  position:absolute;inset:17px;border-radius:50%;
  border:2px dotted rgba(95,100,108,.55);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);
}
.coin::after{
  content:"";
  position:absolute;top:14px;left:32px;width:58px;height:24px;
  border-radius:50%;transform:rotate(-25deg);
  background:rgba(255,255,255,.55);filter:blur(5px);
}
.coin:hover{transform:scale(1.04);box-shadow:inset 0 0 0 3px #fafafa,inset 0 0 0 8px #aeb2b7,inset 0 0 18px rgba(60,65,72,.28),0 22px 38px rgba(40,45,55,.28)}
.coin:active{transform:scale(.96)}
.coin.flipping{animation:flip 1s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{
  0%{transform:rotateY(0) translateY(0)}
  35%{transform:rotateY(720deg) translateY(-22px)}
  70%{transform:rotateY(1440deg) translateY(0)}
  100%{transform:rotateY(1800deg) translateY(0)}
}
button{display:none}
.click-hint{margin:0 0 20px;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#777b88;letter-spacing:.03em}
.answer{min-height:105px;margin-top:26px}
.answer-word{margin:0;font:900 clamp(56px,14vw,92px) -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:.9;letter-spacing:-.06em}
.message{margin:12px 0 0;font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#5f6370}
.odds{margin-top:28px;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.06em;color:#353a45}
.tiny{margin-top:10px;font-size:14px;font-style:italic;color:#7b7f8d}
</style>
</head>
<body>
<main class="card">
<p class="eyebrow">A very important decision</p>
<div class="title-wrap">
  <h1>Should I text my ex?</h1>
</div>
<p class="subtext">✦ Let's ask the universe. ✦</p>

<div class="coin-wrap" id="coinWrap">
  <div class="coin" id="coin" role="button" tabindex="0" aria-label="Flip the coin">?</div>
</div>
<p class="click-hint">Click the coin</p>

<section class="answer" aria-live="polite">
<p class="answer-word" id="answer"></p>
<p class="message" id="message"></p>
</section>

<div class="odds">99% NO &nbsp; | &nbsp; 1% YES</div>
<div class="tiny">Results are scientifically questionable. 😉</div>
</main>

<script>
const coin=document.getElementById("coin");
const answer=document.getElementById("answer");
const message=document.getElementById("message");

let noStreak = 0;
let hasHadFirstYes = false;

function getResult() {
  noStreak++;

  let yesChance;

  if (!hasHadFirstYes) {
    // First YES is designed to arrive somewhere between toss 6 and 15.
    if (noStreak <= 5) {
      yesChance = 0.01;
    } else if (noStreak === 6) {
      yesChance = 0.10;
    } else if (noStreak === 7) {
      yesChance = 0.15;
    } else if (noStreak === 8) {
      yesChance = 0.20;
    } else if (noStreak === 9) {
      yesChance = 0.25;
    } else if (noStreak === 10) {
      yesChance = 0.30;
    } else if (noStreak === 11) {
      yesChance = 0.40;
    } else if (noStreak === 12) {
      yesChance = 0.50;
    } else if (noStreak === 13) {
      yesChance = 0.60;
    } else if (noStreak === 14) {
      yesChance = 0.75;
    } else {
      yesChance = 1.00;
    }
  } else {
    // After the first YES, every new toss goes back to 99% NO / 1% YES.
    yesChance = 0.01;
  }

  const yes = Math.random() < yesChance;

  if (yes) {
    hasHadFirstYes = true;
    noStreak = 0;
  }

  return yes;
}

function flipCoin(){
  coin.style.pointerEvents="none";
  answer.textContent="";
  message.textContent="";
  coin.classList.remove("flipping");
  void coin.offsetWidth;
  coin.classList.add("flipping");

  setTimeout(()=>{
    const wasFirstYes = !hasHadFirstYes;
    const yes=getResult();

    if(yes){
      answer.textContent="YES";
      message.textContent=wasFirstYes
        ? "Fine. You asked enough times. Go text them. 🙄"
        : "The universe has spoken. 👀";
      coin.textContent="YES";
    }else{
      answer.textContent="NO";
      message.textContent=noStreak >= 8
        ? "Seriously? Put the phone down."
        : "Put the phone down.";
      coin.textContent="NO";
    }

    coin.style.pointerEvents="auto";
  },1000);
}

coin.addEventListener("click", flipCoin);
coin.addEventListener("keydown", (event)=>{
  if(event.key==="Enter" || event.key===" "){
    event.preventDefault();
    flipCoin();
  }
});
</script>
</body>
</html>
